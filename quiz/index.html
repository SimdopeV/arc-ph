<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a30">
<meta name="description" content="Live quiz for the Arc community meetup in Port Harcourt.">
<title>Arc PH Live Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="banner" id="banner" role="status" hidden>Reconnecting...</div>

<main class="phone">
  <header>
    <div class="brand">
      <img class="logo" src="Arc_Logo_White.svg" alt="Arc" onerror="this.outerHTML='<span class=logo-text>Arc</span>'">
      <span class="pill">Prompt · Debug · Deploy</span>
    </div>
    <div class="who" id="who"></div>
  </header>

  <div class="screen" id="screen" aria-live="polite">
    <p class="lede">Loading...</p>
  </div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<script src="player.js"></script>
</body>
</html>
