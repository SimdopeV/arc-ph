<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1a30">
<title>Arc Quiz Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="quiz.css">
<link rel="stylesheet" href="host.css">
</head>
<body class="host">

<header class="top">
  <div class="brand">
    <img class="logo" src="Arc_Logo_White.svg" alt="Arc" onerror="this.outerHTML='<span class=logo-text>Arc</span>'">
    <span class="pill">Prompt · Debug · Deploy</span>
  </div>
  <div class="event">Ogbomoso <span>|</span> Community Meetup</div>
  <div class="conn">
    <span class="chip card-chip" id="cardChip" hidden>Card mode</span>
    <span class="chip" id="connChip"><i></i><span>Connecting</span></span>
  </div>
</header>

<div class="card-banner" id="cardBanner" role="status" hidden>
  <b>Card mode</b> Phones are off. Teams hold up A, B, C or D.
  <small>Untick Card mode to let phones answer again.</small>
</div>

<main class="stage" id="stage"></main>

<div class="toast" id="toast" role="status" hidden></div>

<footer class="controls" id="controls">
  <button type="button" data-act="back">Back</button>
  <button type="button" data-act="pause" id="pauseBtn">Pause</button>
  <button type="button" data-act="next" class="go" id="nextBtn">Start quiz</button>
  <button type="button" data-act="end" id="endBtn">End quiz</button>
  <button type="button" data-act="reset" id="resetBtn">Reset game</button>
  <span class="sep"></span>
  <button type="button" data-act="questions" id="questionsBtn">Questions</button>
  <button type="button" data-act="manage" id="manageBtn" aria-pressed="false">Players</button>
  <button type="button" data-act="scores" id="scoresBtn" aria-pressed="false">Team scores shown</button>
  <button type="button" data-act="sound" id="soundBtn" aria-pressed="true">Sound on</button>
  <button type="button" data-act="voice" id="voiceBtn" aria-pressed="true">Voice on</button>
  <label class="switch"><input type="checkbox" id="cardToggle"><span>Card mode</span></label>
  <button type="button" data-act="fullscreen">Full screen</button>
  <span class="keys">Space next · Left back</span>
</footer>

<div class="picker" id="picker" hidden>
  <div class="pk-panel" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
    <header class="pk-head">
      <div>
        <p>Question bank</p>
        <h2 id="pkTitle">Pick the questions for this quiz</h2>
      </div>
      <div class="pk-head-actions">
        <label class="pk-check" title="Keep this off while the projector is showing this screen">
          <input type="checkbox" id="pkAnswers"> Show answers</label>
        <button type="button" class="pk-btn" data-pk="close" id="pkClose">Close</button>
      </div>
    </header>
    <div class="pk-body">
      <section class="pk-bank">
        <div class="pk-tools">
          <input id="pkSearch" type="search" placeholder="Search the bank" autocomplete="off" aria-label="Search the bank">
          <div class="pk-filters" id="pkFilters"></div>
        </div>
        <div class="pk-list" id="pkList"></div>
      </section>
      <aside class="pk-quiz">
        <div class="pk-quiz-head">
          <h3>Your quiz<span id="pkCount"></span></h3>
          <div>
            <button type="button" class="pk-btn" data-pk="shuffle">Shuffle</button>
            <button type="button" class="pk-btn" data-pk="clear">Clear</button>
          </div>
        </div>
        <ol class="pk-chosen" id="pkChosen"></ol>
        <p class="pk-msg" id="pkMsg" role="status"></p>
        <button type="button" class="primary" data-pk="save" id="pkSave">Save quiz</button>
      </aside>
    </div>
  </div>
</div>

<div class="gate" id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="brand">
      <img class="logo" src="Arc_Logo_White.svg" alt="Arc" onerror="this.outerHTML='<span class=logo-text>Arc</span>'">
      <span class="pill">Prompt · Debug · Deploy</span>
    </div>
    <h1>Quiz host</h1>
    <label class="label" for="pin">Host PIN</label>
    <input id="pin" type="password" inputmode="text" autocomplete="off" required>
    <p class="error" id="gateError" role="alert"></p>
    <button class="primary" type="submit" id="gateBtn">Unlock</button>
    <button class="ghost" type="button" id="offlineBtn" hidden>Start offline in card mode</button>
  </form>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="common.js"></script>
<script src="host.js"></script>
</body>
</html>
